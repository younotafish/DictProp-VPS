name: Content Enrichment Audit

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # SHA-256 of the VPS's ECDSA host key, the key appleboy's Go SSH client negotiates. ssh-action and
  # scp-action refuse a host presenting any other key. Read on the VPS and scanned from a runner on 2026-10-01.
  VPS_SSH_FINGERPRINT: SHA256:cWQ58bKePv6GhjAw38ul5Xp0/CnivzcAF5G68MtSAZ0

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The audit only reads production, so it queues apart from deploys and imports and never cancels one
    # that is waiting.
    concurrency:
      group: dictprop-production-read
      cancel-in-progress: false
    steps:
      - name: Audit incomplete words and sentences without generation
        id: audit
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ env.VPS_SSH_FINGERPRINT }}
          command_timeout: 15m
          capture_stdout: true
          script: |
            set -e
            cd /opt/dictprop-vps
            # ssh-action loses the captured output of a command that exits non-zero, so the audit's exit
            # status is dropped here and the alert step reads the stall from its report instead.
            docker compose exec -T \
              -e INCREMENTAL_ENRICHMENT_LOOKBACK_HOURS=24 \
              app nice -n 10 node server/dist/scripts/audit-enrichment.js || true

      - name: Report content coverage
        if: always()
        env:
          ENRICHMENT_STDOUT: ${{ steps.audit.outputs.stdout }}
          ENRICHMENT_STDERR: ${{ steps.audit.outputs.stderr }}
        run: |
          printf '%s\n' "$ENRICHMENT_STDOUT"
          printf '%s\n' "$ENRICHMENT_STDERR" >&2
          {
            echo '### Content enrichment audit (no generation)'
            echo '```json'
            printf '%s\n' "$ENRICHMENT_STDOUT" | grep '^{' | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Alert when local enrichment has stalled
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          ENRICHMENT_STDOUT: ${{ steps.audit.outputs.stdout }}
        run: |
          # ssh-action ends a successful run's output with its own banner, so the report is the last JSON line.
          report="$(printf '%s\n' "$ENRICHMENT_STDOUT" | grep '^{' | tail -n 1)"
          if [ "$AUDIT_OUTCOME" != success ] \
            || ! printf '%s\n' "$report" | jq -e '.stall.alerts | type == "array"' >/dev/null 2>&1; then
            echo '::error::The enrichment audit did not report; see the audit step log.'
            exit 1
          fi
          # Outstanding work is normal between cycles, so only work the cycle should already have done fails.
          printf '%s\n' "$report" | jq -r '.stall.alerts[] | "::error::" + .'
          printf '%s\n' "$report" | jq -e '.stall.alerts | length == 0' >/dev/null
