name: Content Enrichment Audit

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    steps:
      - name: Audit incomplete words and sentences without generation
        id: audit
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          capture_stdout: true
          script: |
            set -e
            cd /opt/dictprop-vps
            docker compose exec -T \
              -e INCREMENTAL_ENRICHMENT_LOOKBACK_HOURS=24 \
              app nice -n 10 node server/dist/scripts/audit-enrichment.js

      - name: Report content coverage
        if: always()
        env:
          ENRICHMENT_STDOUT: ${{ steps.audit.outputs.stdout }}
          ENRICHMENT_STDERR: ${{ steps.audit.outputs.stderr }}
        run: |
          printf '%s\n' "$ENRICHMENT_STDOUT"
          printf '%s\n' "$ENRICHMENT_STDERR" >&2
          {
            echo '### Content enrichment audit (no generation)'
            echo '```json'
            printf '%s\n' "$ENRICHMENT_STDOUT" | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Alert when local enrichment has outstanding work
        if: steps.audit.outcome != 'success'
        run: exit 1
