name: Incremental Content Enrichment

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    steps:
      - name: Enrich newly added words and sentences
        uses: appleboy/ssh-action@v1
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 80m
          script: |
            set -e
            cd /opt/dictprop-vps
            docker compose exec -T \
              -e INCREMENTAL_ENRICHMENT_MAX_ITEMS=8 \
              -e INCREMENTAL_ENRICHMENT_LOOKBACK_HOURS=24 \
              -e INCREMENTAL_ENRICHMENT_MAX_RUNTIME_MINUTES=70 \
              app nice -n 10 node server/dist/scripts/enrich-new-items.js
