name: TTS Backfill

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # SHA-256 of the VPS's ECDSA host key, the key appleboy's Go SSH client negotiates. ssh-action and
  # scp-action refuse a host presenting any other key. Read on the VPS and scanned from a runner on 2026-10-01.
  VPS_SSH_FINGERPRINT: SHA256:cWQ58bKePv6GhjAw38ul5Xp0/CnivzcAF5G68MtSAZ0

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: dictprop-tts-backfill-control
      cancel-in-progress: false
    steps:
      - name: Start or resume the detached TTS backfill
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ env.VPS_SSH_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -e
            cd /opt/dictprop-vps
            STARTED_AT="$(date +%s)"
            docker compose exec -d app nice -n 10 node server/dist/scripts/run-tts-backfill.js
            # A worker writes its status once it has started, and a running one rewrites it every 30 seconds, so
            # a status older than this step is an earlier run's.
            for attempt in $(seq 1 30); do
              if [ -f data/tts-backfill-status.json ] && [ "$(stat -c %Y data/tts-backfill-status.json)" -ge "$STARTED_AT" ]; then
                cat data/tts-backfill-status.json
                exit 0
              fi
              sleep 2
            done
            echo "The TTS worker was started, or was already running, but has not written a status yet"
