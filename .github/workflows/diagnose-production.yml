name: Diagnose Production VPS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # SHA-256 of the VPS's ECDSA host key, the key appleboy's Go SSH client negotiates. ssh-action and
  # scp-action refuse a host presenting any other key. Read on the VPS and scanned from a runner on 2026-10-01.
  VPS_SSH_FINGERPRINT: SHA256:cWQ58bKePv6GhjAw38ul5Xp0/CnivzcAF5G68MtSAZ0

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect host and app state
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ env.VPS_SSH_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -u
            cd /opt/dictprop-vps
            echo '=== UPTIME ==='
            uptime
            echo '=== MEMORY ==='
            free -h
            echo '=== DISK ==='
            df -h .
            ls -lah data | sed -n '1,80p'
            find data/backups -maxdepth 1 -type f -printf '%s %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>/dev/null \
              | sort -nr | head -20 || true
            echo '=== SQLITE STORAGE ==='
            docker compose exec -T app node -e '
              const Database = require("/app/server/node_modules/better-sqlite3");
              const db = new Database("/app/data/dictprop.db", { readonly: true });
              const scalar = sql => Object.values(db.prepare(sql).get())[0];
              console.log(JSON.stringify({
                pageSize: db.pragma("page_size", { simple: true }),
                pageCount: db.pragma("page_count", { simple: true }),
                freePages: db.pragma("freelist_count", { simple: true }),
                journalMode: db.pragma("journal_mode", { simple: true }),
                itemImages: scalar("SELECT COUNT(*) FROM item_images"),
                legacyImageRows: scalar("SELECT COUNT(*) FROM item_images WHERE content_hash IS NULL"),
                imageBlobs: scalar("SELECT COUNT(*) FROM image_blobs"),
                sentenceImages: Object.values(db.prepare(`SELECT COUNT(*) FROM item_images ii
                  JOIN items i ON i.id = ii.id AND i.user_id = ii.user_id
                  WHERE i.type = ? AND i.is_deleted = 0`).get("sentence"))[0],
                recentlyUpdatedImages: scalar(`SELECT COUNT(*) FROM item_images
                  WHERE updated_at >= ${Date.now() - 2 * 60 * 60 * 1000}`),
              }));
              db.close();
            '
            echo '=== DUPLICATE SAVED SENTENCES ==='
            # This run log is public, so it gets counts, ids and flags only, never a sentence's text.
            docker compose exec -T app node - <<'NODE'
              const Database = require('/app/server/node_modules/better-sqlite3');
              const db = new Database('/app/data/dictprop.db', { readonly: true });
              const normalize = value => String(value || '')
                .replace(/\{\{([^{}]+)\}\}/g, '$1')
                .replace(/\[\[([^\[\]]+)\]\]/g, '$1')
                .normalize('NFKC')
                .toLowerCase()
                .replace(/[\u2018\u2019]/g, "'")
                .replace(/[\u201c\u201d]/g, '"')
                .replace(/[\u2013\u2014]/g, '-')
                .replace(/\s+/g, ' ')
                .trim();
              const groups = new Map();
              for (const row of db.prepare(`SELECT i.id, i.data, i.srs, i.saved_at, i.updated_at,
                  i.is_archived, i.revision, ii.id IS NOT NULL AS has_image, ib.byte_length AS image_bytes
                FROM items i
                LEFT JOIN item_images ii ON ii.id = i.id AND ii.user_id = i.user_id
                LEFT JOIN image_blobs ib ON ib.content_hash = ii.content_hash
                WHERE i.type = 'sentence' AND i.is_deleted = 0`).all()) {
                const data = JSON.parse(row.data);
                const key = normalize(data.text);
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push({
                  id: row.id,
                  reviews: row.srs ? JSON.parse(row.srs).totalReviews ?? 0 : 0,
                  savedAt: row.saved_at,
                  updatedAt: row.updated_at,
                  isArchived: row.is_archived === 1,
                  revision: row.revision,
                  hasImage: row.has_image === 1,
                  imageBytes: row.image_bytes ?? null,
                  hasAnalysis: !!data.analysis,
                });
              }
              const duplicates = [...groups.values()].filter(entries => entries.length > 1);
              console.log(JSON.stringify({
                duplicateGroups: duplicates.length,
                duplicateItems: duplicates.reduce((sum, entries) => sum + entries.length, 0),
              }));
              for (const entries of duplicates) console.log(JSON.stringify(entries));
              db.close();
            NODE
            echo '=== CONTAINERS ==='
            docker compose ps
            docker stats --no-stream || true
            echo '=== RELEVANT PROCESSES ==='
            # Command lines can carry credentials, so the rest of a line after a key, token, secret or password is masked.
            ps -eo pid,ppid,stat,etime,%cpu,%mem,cmd \
              | grep -E 'import-(sentence-backfill|offline-images)|docker|node|sqlite|openssl' \
              | grep -v grep \
              | sed -E 's/((authorization|bearer|key|token|secret|pass(word|wd)?)[=: ]+).*/\1[masked]/I' \
              | cut -c1-200 || true
            echo '=== LOCAL HEALTH ==='
            curl --max-time 5 -sS -w '\nHTTP %{http_code} in %{time_total}s\n' http://localhost:3000/api/health || true
