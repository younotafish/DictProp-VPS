name: Sentence Backfill Bridge
# A publisher recognizes its own import run by the release tag in the title.
run-name: ${{ inputs.operation }} ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Encrypted bridge operation
        required: true
        type: choice
        options:
          - export
          - import
          - corpus-export
          - corpus-import
          - image-import
          - audio-import
          - enrichment-import
          - essay-import
          - audit
          - repair
          - repair-apply
      release_tag:
        description: Temporary release tag containing the encrypted import asset
        required: false
        type: string
      confirm:
        description: For repair-apply only, type apply-production-repair to write the previewed repairs
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  # SHA-256 of the VPS's ECDSA host key, the key appleboy's Go SSH client negotiates. ssh-action and
  # scp-action refuse a host presenting any other key. Read on the VPS and scanned from a runner on 2026-10-01.
  VPS_SSH_FINGERPRINT: SHA256:cWQ58bKePv6GhjAw38ul5Xp0/CnivzcAF5G68MtSAZ0
  # The bridge jobs' own OpenSSH (scripts/offline/vps-ssh.sh) trusts only these host keys. The ECDSA line
  # is the key VPS_SSH_FINGERPRINT pins; the Ed25519 line was read from the VPS with it.
  VPS_KNOWN_HOSTS: |
    107.152.47.101 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLB6yrbgTM0awD4dC9m2xnVS3P6j4DQt01T6Km5u01xVw4/G3QtMjKeOBeMiPv06s8FdC/x30TMBh70fv+eMcf0=
    107.152.47.101 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILKRKN8J56mPFYuCucDWxCSMH2j7tEGz6OchWZ9ur3lW

jobs:
  repair:
    if: inputs.operation == 'repair' || inputs.operation == 'repair-apply'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A group holds one running and one pending job, and a newly queued job cancels the pending one. Jobs
    # that only read production queue apart, so they never cancel a waiting deploy or import.
    concurrency:
      group: ${{ inputs.operation == 'repair-apply' && 'dictprop-production' || 'dictprop-production-read' }}
      cancel-in-progress: false
    steps:
      # A plain repair run only previews. Writing needs its own choice plus the typed confirmation.
      - name: Validate repair confirmation
        if: inputs.operation == 'repair-apply'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "apply-production-repair" ]; then
            echo "repair-apply writes production data: set confirm to apply-production-repair" >&2
            exit 1
          fi

      - name: Preview production repairs
        id: repair_preview
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ env.VPS_SSH_FINGERPRINT }}
          command_timeout: 15m
          capture_stdout: true
          script: |
            set -e
            cd /opt/dictprop-vps
            docker compose exec -T app node server/dist/scripts/repair-production-data.js

      - name: Report repair preview
        env:
          REPAIR_PREVIEW: ${{ steps.repair_preview.outputs.stdout }}
        run: printf '%s\n' "$REPAIR_PREVIEW"

      - name: Apply production repairs
        if: inputs.operation == 'repair-apply'
        id: repair_apply
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ env.VPS_SSH_FINGERPRINT }}
          command_timeout: 30m
          capture_stdout: true
          script: |
            set -e
            cd /opt/dictprop-vps
            # The script first copies the database to data/backups/pre-repair-<time>.db. The repair is
            # one transaction, so a failure cannot leave a partially consolidated library.
            docker compose exec -T app node server/dist/scripts/repair-production-data.js --apply

      - name: Report applied repairs
        if: inputs.operation == 'repair-apply'
        env:
          REPAIR_OUTPUT: ${{ steps.repair_apply.outputs.stdout }}
        run: printf '%s\n' "$REPAIR_OUTPUT"

  audit:
    if: inputs.operation == 'audit'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: dictprop-production-read
      cancel-in-progress: false
    steps:
      - name: Audit production data
        id: production_audit
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ env.VPS_SSH_FINGERPRINT }}
          command_timeout: 60m
          capture_stdout: true
          script: |
            set -e
            cd /opt/dictprop-vps
            docker compose exec -T app nice -n 19 node server/dist/scripts/audit-production-data.js

      - name: Report production audit
        env:
          AUDIT_OUTPUT: ${{ steps.production_audit.outputs.stdout }}
        run: printf '%s\n' "$AUDIT_OUTPUT"

  # Exports leave the runner only as this run's encrypted artifact, which the local cycle downloads,
  # decrypts and then deletes together with the run's log.
  export:
    if: inputs.operation == 'export'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: dictprop-production-read
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/offline/bridge-crypto.mjs
            scripts/offline/bridge-export.sh
            scripts/offline/vps-ssh.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Export encrypted sentence records
        timeout-minutes: 15
        env:
          SENTENCE_BRIDGE_KEY: ${{ secrets.SENTENCE_BRIDGE_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_SCRIPT: |
            set -eo pipefail
            cd /opt/dictprop-vps
            docker compose exec -T app node server/dist/scripts/export-sentence-backfill.js | gzip -9
        run: bash scripts/offline/bridge-export.sh sentence-export "$RUNNER_TEMP/sentence-export.dpb"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentence-export
          path: ${{ runner.temp }}/sentence-export.dpb
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Each import decrypts its release asset on the runner, for its own operation and release tag only,
  # and streams the bundle to the VPS over the pinned SSH channel (scripts/offline/bridge-import.sh).
  # The bundle arrives on the remote script's standard input, so only the unpacking may read it.
  import:
    if: inputs.operation == 'import'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Validate import input
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]{1,200}$ ]]

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/offline/bridge-crypto.mjs
            scripts/offline/bridge-import.sh
            scripts/offline/vps-ssh.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Import encrypted sentence enrichment
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SENTENCE_BRIDGE_KEY: ${{ secrets.SENTENCE_BRIDGE_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_SCRIPT: |
            set -eo pipefail
            exec 3<&0 < /dev/null
            cd /opt/dictprop-vps
            docker compose exec -T app sh -c \
              'rm -rf /tmp/sentence-backfill && mkdir -p /tmp/sentence-backfill && tar -xz -C /tmp/sentence-backfill' <&3
            exec 3<&-
            set +e
            docker compose exec -T app nice -n 10 node server/dist/scripts/import-sentence-backfill.js \
              /tmp/sentence-backfill/manifest.json
            STATUS=$?
            set -e
            docker compose exec -T app rm -rf /tmp/sentence-backfill
            exit "$STATUS"
        run: bash scripts/offline/bridge-import.sh import sentence-backfill.enc

  enrichment-import:
    if: inputs.operation == 'enrichment-import'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Validate enrichment input
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]{1,200}$ ]]

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/offline/bridge-crypto.mjs
            scripts/offline/bridge-import.sh
            scripts/offline/vps-ssh.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Import encrypted example enrichments
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SENTENCE_BRIDGE_KEY: ${{ secrets.SENTENCE_BRIDGE_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_SCRIPT: |
            set -eo pipefail
            exec 3<&0 < /dev/null
            cd /opt/dictprop-vps
            AVAILABLE_KB=$(df -Pk /opt/dictprop-vps | awk 'NR == 2 { print $4 }')
            MIN_FREE_KB=$((5 * 1024 * 1024))
            echo "example-enrichment capacity: ${AVAILABLE_KB}KB free; floor ${MIN_FREE_KB}KB"
            test "$AVAILABLE_KB" -ge "$MIN_FREE_KB"
            docker compose exec -T app sh -c \
              'rm -rf /tmp/sentence-enrichments && mkdir -p /tmp/sentence-enrichments && tar -xz -C /tmp/sentence-enrichments' <&3
            exec 3<&-
            set +e
            docker compose exec -T app nice -n 10 node server/dist/scripts/import-sentence-enrichments.js \
              /tmp/sentence-enrichments/manifest.json
            STATUS=$?
            set -e
            docker compose exec -T app rm -rf /tmp/sentence-enrichments
            exit "$STATUS"
        run: bash scripts/offline/bridge-import.sh enrichment-import sentence-enrichments.enc

  essay-import:
    if: inputs.operation == 'essay-import'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Validate private essay input
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]{1,200}$ ]]

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/offline/bridge-crypto.mjs
            scripts/offline/bridge-import.sh
            scripts/offline/vps-ssh.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Import encrypted private essay catalog
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SENTENCE_BRIDGE_KEY: ${{ secrets.SENTENCE_BRIDGE_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_SCRIPT: |
            set -eo pipefail
            exec 3<&0 < /dev/null
            cd /opt/dictprop-vps
            docker compose exec -T app sh -c \
              'rm -rf /tmp/private-essay-catalog && mkdir -p /tmp/private-essay-catalog && tar -xz -C /tmp/private-essay-catalog' <&3
            exec 3<&-
            set +e
            docker compose exec -T app node server/dist/scripts/import-private-essay-catalog.js \
              /tmp/private-essay-catalog/catalog.json
            STATUS=$?
            set -e
            docker compose exec -T app rm -rf /tmp/private-essay-catalog
            exit "$STATUS"
        run: bash scripts/offline/bridge-import.sh essay-import private-essay-catalog.enc

  corpus-export:
    if: inputs.operation == 'corpus-export'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: dictprop-production-read
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/offline/bridge-crypto.mjs
            scripts/offline/bridge-export.sh
            scripts/offline/vps-ssh.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Export encrypted corpus
        timeout-minutes: 15
        env:
          SENTENCE_BRIDGE_KEY: ${{ secrets.SENTENCE_BRIDGE_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_SCRIPT: |
            set -eo pipefail
            cd /opt/dictprop-vps
            docker compose exec -T app node server/dist/scripts/export-corpus-audit.js | gzip -9
        run: bash scripts/offline/bridge-export.sh corpus-export "$RUNNER_TEMP/corpus-export.dpb"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-export
          path: ${{ runner.temp }}/corpus-export.dpb
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  corpus-import:
    if: inputs.operation == 'corpus-import'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Validate import input
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]{1,200}$ ]]

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/offline/bridge-crypto.mjs
            scripts/offline/bridge-import.sh
            scripts/offline/vps-ssh.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Import encrypted corpus audit
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SENTENCE_BRIDGE_KEY: ${{ secrets.SENTENCE_BRIDGE_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_SCRIPT: |
            set -eo pipefail
            exec 3<&0 < /dev/null
            cd /opt/dictprop-vps
            docker compose exec -T app sh -c \
              'rm -rf /tmp/corpus-audit && mkdir -p /tmp/corpus-audit && tar -xz -C /tmp/corpus-audit' <&3
            exec 3<&-
            set +e
            docker compose exec -T app node server/dist/scripts/import-corpus-audit.js \
              /tmp/corpus-audit/manifest.json
            STATUS=$?
            set -e
            docker compose exec -T app rm -rf /tmp/corpus-audit
            exit "$STATUS"
        run: bash scripts/offline/bridge-import.sh corpus-import corpus-audit.enc

  image-import:
    if: inputs.operation == 'image-import'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Validate import input
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]{1,200}$ ]]

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/offline/bridge-crypto.mjs
            scripts/offline/bridge-import.sh
            scripts/offline/vps-ssh.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Import locally generated images
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SENTENCE_BRIDGE_KEY: ${{ secrets.SENTENCE_BRIDGE_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_SCRIPT: |
            set -eo pipefail
            exec 3<&0 < /dev/null
            cd /opt/dictprop-vps
            docker compose exec -T app sh -c \
              'rm -rf /tmp/offline-images && mkdir -p /tmp/offline-images && tar -xz -C /tmp/offline-images' <&3
            exec 3<&-
            set +e
            docker compose exec -T app nice -n 10 node server/dist/scripts/import-offline-images.js \
              /tmp/offline-images/manifest.json
            STATUS=$?
            set -e
            docker compose exec -T app rm -rf /tmp/offline-images
            exit "$STATUS"
        run: bash scripts/offline/bridge-import.sh image-import offline-images.enc

  audio-import:
    if: inputs.operation == 'audio-import'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Validate audio import input
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]{1,200}$ ]]

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/offline/bridge-crypto.mjs
            scripts/offline/bridge-import.sh
            scripts/offline/vps-ssh.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Import locally generated audio
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SENTENCE_BRIDGE_KEY: ${{ secrets.SENTENCE_BRIDGE_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_SCRIPT: |
            set -eo pipefail
            exec 3<&0 < /dev/null
            cd /opt/dictprop-vps
            AVAILABLE_KB=$(df -Pk /opt/dictprop-vps | awk 'NR == 2 { print $4 }')
            MIN_FREE_KB=$((5 * 1024 * 1024))
            echo "offline-audio capacity: ${AVAILABLE_KB}KB free; floor ${MIN_FREE_KB}KB"
            test "$AVAILABLE_KB" -ge "$MIN_FREE_KB"
            docker compose exec -T app sh -c \
              'rm -rf /tmp/offline-audio && mkdir -p /tmp/offline-audio && tar -xz -C /tmp/offline-audio' <&3
            exec 3<&-
            set +e
            docker compose exec -T app nice -n 10 node server/dist/scripts/import-offline-tts.js \
              /tmp/offline-audio/manifest.json
            STATUS=$?
            set -e
            docker compose exec -T app rm -rf /tmp/offline-audio
            exit "$STATUS"
        run: bash scripts/offline/bridge-import.sh audio-import offline-audio.enc
