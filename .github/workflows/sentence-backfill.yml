name: Sentence Backfill Bridge

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Encrypted bridge operation
        required: true
        type: choice
        options:
          - export
          - import
          - corpus-export
          - corpus-import
          - image-import
          - audio-import
          - enrichment-import
          - audit
          - repair
      release_tag:
        description: Temporary release tag containing the encrypted import asset
        required: false
        type: string

jobs:
  repair:
    if: inputs.operation == 'repair'
    runs-on: ubuntu-latest
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    steps:
      - name: Preview production repairs
        id: repair_preview
        uses: appleboy/ssh-action@v1
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          capture_stdout: true
          script: |
            set -e
            cd /opt/dictprop-vps
            docker compose exec -T app node server/dist/scripts/repair-production-data.js

      - name: Report repair preview
        env:
          REPAIR_PREVIEW: ${{ steps.repair_preview.outputs.stdout }}
        run: printf '%s\n' "$REPAIR_PREVIEW"

      - name: Apply production repairs
        id: repair_apply
        uses: appleboy/ssh-action@v1
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          capture_stdout: true
          script: |
            set -e
            cd /opt/dictprop-vps
            # The deploy workflow keeps a verified SQLite snapshot. This repair is additionally one
            # transaction, so a failure cannot leave a partially consolidated library.
            docker compose exec -T app node server/dist/scripts/repair-production-data.js --apply

      - name: Report applied repairs
        env:
          REPAIR_OUTPUT: ${{ steps.repair_apply.outputs.stdout }}
        run: printf '%s\n' "$REPAIR_OUTPUT"

  audit:
    if: inputs.operation == 'audit'
    runs-on: ubuntu-latest
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    steps:
      - name: Audit production data
        id: production_audit
        uses: appleboy/ssh-action@v1
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 60m
          capture_stdout: true
          script: |
            set -e
            cd /opt/dictprop-vps
            docker compose exec -T app nice -n 19 node server/dist/scripts/audit-production-data.js

      - name: Report production audit
        env:
          AUDIT_OUTPUT: ${{ steps.production_audit.outputs.stdout }}
        run: printf '%s\n' "$AUDIT_OUTPUT"

  export:
    if: inputs.operation == 'export'
    runs-on: ubuntu-latest
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    steps:
      - name: Export encrypted sentence records
        uses: appleboy/ssh-action@v1
        env:
          SENTENCE_BRIDGE_KEY: ${{ secrets.SENTENCE_BRIDGE_KEY }}
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SENTENCE_BRIDGE_KEY
          command_timeout: 15m
          script: |
            set -e
            test -n "$SENTENCE_BRIDGE_KEY"
            cd /opt/dictprop-vps
            echo SENTENCE_EXPORT_BEGIN
            docker compose exec -T app node server/dist/scripts/export-sentence-backfill.js \
              | gzip -9 \
              | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:SENTENCE_BRIDGE_KEY \
              | base64 -w 76
            echo
            echo SENTENCE_EXPORT_END

  import:
    if: inputs.operation == 'import'
    runs-on: ubuntu-latest
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Validate import input
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]{1,200}$ ]]

      - name: Import encrypted sentence enrichment
        id: sentence_import
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        env:
          SENTENCE_BRIDGE_KEY: ${{ secrets.SENTENCE_BRIDGE_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SENTENCE_BRIDGE_KEY,RELEASE_TAG
          command_timeout: 60m
          capture_stdout: true
          script: |
            set -e
            test -n "$SENTENCE_BRIDGE_KEY"
            cd /opt/dictprop-vps
            rm -rf /tmp/dictprop-sentence-bridge
            mkdir -p /tmp/dictprop-sentence-bridge
            curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors \
              --connect-timeout 20 --max-time 300 \
              --output /tmp/dictprop-sentence-bridge/sentence-backfill.enc \
              "https://github.com/younotafish/DictProp-VPS/releases/download/$RELEASE_TAG/sentence-backfill.enc"
            docker compose exec -T app sh -c 'rm -rf /tmp/sentence-backfill && mkdir -p /tmp/sentence-backfill'
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -pass env:SENTENCE_BRIDGE_KEY \
              -in /tmp/dictprop-sentence-bridge/sentence-backfill.enc \
              | docker compose exec -T app tar -xz -C /tmp/sentence-backfill
            set +e
            docker compose exec -T app nice -n 10 node server/dist/scripts/import-sentence-backfill.js \
              /tmp/sentence-backfill/manifest.json
            STATUS=$?
            set -e
            docker compose exec -T app rm -rf /tmp/sentence-backfill
            rm -rf /tmp/dictprop-sentence-bridge
            exit "$STATUS"

      - name: Report sentence import result
        if: always()
        env:
          REMOTE_STDOUT: ${{ steps.sentence_import.outputs.stdout }}
          REMOTE_STDERR: ${{ steps.sentence_import.outputs.stderr }}
        run: |
          printf '%s\n' "$REMOTE_STDOUT"
          printf '%s\n' "$REMOTE_STDERR" >&2

      - name: Enforce sentence import success
        if: steps.sentence_import.outcome != 'success'
        run: exit 1

  enrichment-import:
    if: inputs.operation == 'enrichment-import'
    runs-on: ubuntu-latest
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Validate enrichment input
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]{1,200}$ ]]

      - name: Import encrypted example enrichments
        id: enrichment_import
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        env:
          SENTENCE_BRIDGE_KEY: ${{ secrets.SENTENCE_BRIDGE_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SENTENCE_BRIDGE_KEY,RELEASE_TAG
          command_timeout: 60m
          capture_stdout: true
          script: |
            set -e
            test -n "$SENTENCE_BRIDGE_KEY"
            cd /opt/dictprop-vps
            AVAILABLE_KB=$(df -Pk /opt/dictprop-vps | awk 'NR == 2 { print $4 }')
            MIN_FREE_KB=$((5 * 1024 * 1024))
            echo "example-enrichment capacity: ${AVAILABLE_KB}KB free; floor ${MIN_FREE_KB}KB"
            test "$AVAILABLE_KB" -ge "$MIN_FREE_KB"
            rm -rf /tmp/dictprop-enrichment-bridge
            mkdir -p /tmp/dictprop-enrichment-bridge
            curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors \
              --connect-timeout 20 --max-time 300 \
              --output /tmp/dictprop-enrichment-bridge/sentence-enrichments.enc \
              "https://github.com/younotafish/DictProp-VPS/releases/download/$RELEASE_TAG/sentence-enrichments.enc"
            docker compose exec -T app sh -c 'rm -rf /tmp/sentence-enrichments && mkdir -p /tmp/sentence-enrichments'
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -pass env:SENTENCE_BRIDGE_KEY \
              -in /tmp/dictprop-enrichment-bridge/sentence-enrichments.enc \
              | docker compose exec -T app tar -xz -C /tmp/sentence-enrichments
            set +e
            docker compose exec -T app nice -n 10 node server/dist/scripts/import-sentence-enrichments.js \
              /tmp/sentence-enrichments/manifest.json
            STATUS=$?
            set -e
            docker compose exec -T app rm -rf /tmp/sentence-enrichments
            rm -rf /tmp/dictprop-enrichment-bridge
            exit "$STATUS"

      - name: Report enrichment import result
        if: always()
        env:
          REMOTE_STDOUT: ${{ steps.enrichment_import.outputs.stdout }}
          REMOTE_STDERR: ${{ steps.enrichment_import.outputs.stderr }}
        run: |
          printf '%s\n' "$REMOTE_STDOUT"
          printf '%s\n' "$REMOTE_STDERR" >&2

      - name: Enforce enrichment import success
        if: steps.enrichment_import.outcome != 'success'
        run: exit 1

  corpus-export:
    if: inputs.operation == 'corpus-export'
    runs-on: ubuntu-latest
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    steps:
      - name: Export encrypted corpus
        uses: appleboy/ssh-action@v1
        env:
          SENTENCE_BRIDGE_KEY: ${{ secrets.SENTENCE_BRIDGE_KEY }}
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SENTENCE_BRIDGE_KEY
          command_timeout: 15m
          script: |
            set -e
            test -n "$SENTENCE_BRIDGE_KEY"
            cd /opt/dictprop-vps
            echo CORPUS_EXPORT_BEGIN
            docker compose exec -T app node server/dist/scripts/export-corpus-audit.js \
              | gzip -9 \
              | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:SENTENCE_BRIDGE_KEY \
              | base64 -w 76
            echo
            echo CORPUS_EXPORT_END

  corpus-import:
    if: inputs.operation == 'corpus-import'
    runs-on: ubuntu-latest
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Validate import input
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: test -n "$RELEASE_TAG"

      - name: Download encrypted bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p bridge
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern corpus-audit.enc \
            --dir bridge

      - name: Upload encrypted bundle
        uses: appleboy/scp-action@v1
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: bridge/corpus-audit.enc
          target: /tmp/dictprop-corpus-bridge
          strip_components: 1

      - name: Import encrypted corpus audit
        id: corpus_import
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        env:
          SENTENCE_BRIDGE_KEY: ${{ secrets.SENTENCE_BRIDGE_KEY }}
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SENTENCE_BRIDGE_KEY
          command_timeout: 60m
          capture_stdout: true
          script: |
            set -e
            test -n "$SENTENCE_BRIDGE_KEY"
            cd /opt/dictprop-vps
            docker compose exec -T app sh -c 'rm -rf /tmp/corpus-audit && mkdir -p /tmp/corpus-audit'
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -pass env:SENTENCE_BRIDGE_KEY \
              -in /tmp/dictprop-corpus-bridge/corpus-audit.enc \
              | docker compose exec -T app tar -xz -C /tmp/corpus-audit
            set +e
            docker compose exec -T app node server/dist/scripts/import-corpus-audit.js \
              /tmp/corpus-audit/manifest.json
            STATUS=$?
            set -e
            docker compose exec -T app rm -rf /tmp/corpus-audit
            rm -rf /tmp/dictprop-corpus-bridge
            exit "$STATUS"

      - name: Report corpus import result
        if: always()
        env:
          REMOTE_STDOUT: ${{ steps.corpus_import.outputs.stdout }}
          REMOTE_STDERR: ${{ steps.corpus_import.outputs.stderr }}
        run: |
          printf '%s\n' "$REMOTE_STDOUT"
          printf '%s\n' "$REMOTE_STDERR" >&2

      - name: Enforce corpus import success
        if: steps.corpus_import.outcome != 'success'
        run: exit 1

  image-import:
    if: inputs.operation == 'image-import'
    runs-on: ubuntu-latest
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Validate import input
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]{1,200}$ ]]

      - name: Import locally generated images
        uses: appleboy/ssh-action@v1
        env:
          SENTENCE_BRIDGE_KEY: ${{ secrets.SENTENCE_BRIDGE_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SENTENCE_BRIDGE_KEY,RELEASE_TAG
          command_timeout: 60m
          script: |
            set -e
            test -n "$SENTENCE_BRIDGE_KEY"
            cd /opt/dictprop-vps
            rm -rf /tmp/dictprop-image-bridge
            mkdir -p /tmp/dictprop-image-bridge
            curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors \
              --connect-timeout 20 --max-time 300 \
              --output /tmp/dictprop-image-bridge/offline-images.enc \
              "https://github.com/younotafish/DictProp-VPS/releases/download/$RELEASE_TAG/offline-images.enc"
            docker compose exec -T app sh -c 'rm -rf /tmp/offline-images && mkdir -p /tmp/offline-images'
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -pass env:SENTENCE_BRIDGE_KEY \
              -in /tmp/dictprop-image-bridge/offline-images.enc \
              | docker compose exec -T app tar -xz -C /tmp/offline-images
            set +e
            docker compose exec -T app nice -n 10 node server/dist/scripts/import-offline-images.js \
              /tmp/offline-images/manifest.json
            STATUS=$?
            set -e
            docker compose exec -T app rm -rf /tmp/offline-images
            rm -rf /tmp/dictprop-image-bridge
            exit "$STATUS"

  audio-import:
    if: inputs.operation == 'audio-import'
    runs-on: ubuntu-latest
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Validate audio import input
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]{1,200}$ ]]

      - name: Import locally generated audio
        uses: appleboy/ssh-action@v1
        env:
          SENTENCE_BRIDGE_KEY: ${{ secrets.SENTENCE_BRIDGE_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SENTENCE_BRIDGE_KEY,RELEASE_TAG
          command_timeout: 60m
          script: |
            set -e
            test -n "$SENTENCE_BRIDGE_KEY"
            cd /opt/dictprop-vps
            AVAILABLE_KB=$(df -Pk /opt/dictprop-vps | awk 'NR == 2 { print $4 }')
            MIN_FREE_KB=$((5 * 1024 * 1024))
            echo "offline-audio capacity: ${AVAILABLE_KB}KB free; floor ${MIN_FREE_KB}KB"
            test "$AVAILABLE_KB" -ge "$MIN_FREE_KB"
            rm -rf /tmp/dictprop-audio-bridge
            mkdir -p /tmp/dictprop-audio-bridge
            curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors \
              --connect-timeout 20 --max-time 600 \
              --output /tmp/dictprop-audio-bridge/offline-audio.enc \
              "https://github.com/younotafish/DictProp-VPS/releases/download/$RELEASE_TAG/offline-audio.enc"
            docker compose exec -T app sh -c 'rm -rf /tmp/offline-audio && mkdir -p /tmp/offline-audio'
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -pass env:SENTENCE_BRIDGE_KEY \
              -in /tmp/dictprop-audio-bridge/offline-audio.enc \
              | docker compose exec -T app tar -xz -C /tmp/offline-audio
            set +e
            docker compose exec -T app nice -n 10 node server/dist/scripts/import-offline-tts.js \
              /tmp/offline-audio/manifest.json
            STATUS=$?
            set -e
            docker compose exec -T app rm -rf /tmp/offline-audio
            rm -rf /tmp/dictprop-audio-bridge
            exit "$STATUS"
