name: Sentence Backfill Bridge
# A publisher recognizes its own import run by the release tag in the title.
run-name: ${{ inputs.operation }} ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Encrypted bridge operation
        required: true
        type: choice
        options:
          - export
          - import
          - corpus-export
          - corpus-import
          - image-import
          - audio-import
          - enrichment-import
          - essay-import
          - audit
          - repair
          - repair-apply
      release_tag:
        description: Temporary release tag containing the encrypted import asset
        required: false
        type: string
      confirm:
        description: For repair-apply only, type apply-production-repair to write the previewed repairs
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  # SHA-256 of the VPS's ECDSA host key, the key appleboy's Go SSH client negotiates. ssh-action and
  # scp-action refuse a host presenting any other key. Read on the VPS and scanned from a runner on 2026-10-01.
  VPS_SSH_FINGERPRINT: SHA256:cWQ58bKePv6GhjAw38ul5Xp0/CnivzcAF5G68MtSAZ0
  # The bridge jobs' own OpenSSH (scripts/offline/vps-ssh.sh) trusts only these host keys. The ECDSA line
  # is the key VPS_SSH_FINGERPRINT pins; the Ed25519 line was read from the VPS with it.
  VPS_KNOWN_HOSTS: |
    107.152.47.101 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLB6yrbgTM0awD4dC9m2xnVS3P6j4DQt01T6Km5u01xVw4/G3QtMjKeOBeMiPv06s8FdC/x30TMBh70fv+eMcf0=
    107.152.47.101 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILKRKN8J56mPFYuCucDWxCSMH2j7tEGz6OchWZ9ur3lW

jobs:
  repair:
    if: inputs.operation == 'repair' || inputs.operation == 'repair-apply'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A group holds one running and one pending job, and a newly queued job cancels the pending one. Jobs
    # that only read production queue apart, so they never cancel a waiting deploy or import.
    concurrency:
      group: ${{ inputs.operation == 'repair-apply' && 'dictprop-production' || 'dictprop-production-read' }}
      cancel-in-progress: false
    steps:
      # A plain repair run only previews. Writing needs its own choice plus the typed confirmation.
      - name: Validate repair confirmation
        if: inputs.operation == 'repair-apply'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "apply-production-repair" ]; then
            echo "repair-apply writes production data: set confirm to apply-production-repair" >&2
            exit 1
          fi

      # Each step's log shows the script's report.
      - name: Preview production repairs
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ env.VPS_SSH_FINGERPRINT }}
          command_timeout: 15m
          script: |
            set -e
            cd /opt/dictprop-vps
            docker compose exec -T app node server/dist/scripts/repair-production-data.js

      - name: Apply production repairs
        if: inputs.operation == 'repair-apply'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ env.VPS_SSH_FINGERPRINT }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/dictprop-vps
            # The script first copies the database to data/backups/pre-repair-<time>.db. The repair is
            # one transaction, so a failure cannot leave a partially consolidated library.
            docker compose exec -T app node server/dist/scripts/repair-production-data.js --apply

  audit:
    if: inputs.operation == 'audit'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: dictprop-production-read
      cancel-in-progress: false
    steps:
      # The step's log shows the audit's report.
      - name: Audit production data
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ env.VPS_SSH_FINGERPRINT }}
          command_timeout: 60m
          script: |
            set -e
            cd /opt/dictprop-vps
            docker compose exec -T app nice -n 19 node server/dist/scripts/audit-production-data.js

  # Exports leave the runner only as this run's encrypted artifact, which the local cycle downloads,
  # decrypts and then deletes together with the run's log.
  export:
    # The cycle and the corrections publisher find their export's job by its name, the operation.
    name: ${{ inputs.operation }}
    if: inputs.operation == 'export' || inputs.operation == 'corpus-export'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: dictprop-production-read
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/offline/bridge-crypto.mjs
            scripts/offline/bridge-export.sh
            scripts/offline/vps-ssh.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Export the encrypted ${{ inputs.operation }} records
        id: export
        timeout-minutes: 15
        env:
          OPERATION: ${{ inputs.operation }}
          SENTENCE_BRIDGE_KEY: ${{ secrets.SENTENCE_BRIDGE_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          # Runs on the VPS, in root's login shell, zsh, after the line that names the operation's exporter.
          EXPORT_SCRIPT: |
            set -eo pipefail
            cd /opt/dictprop-vps
            docker compose exec -T app node "server/dist/scripts/$EXPORTER" | gzip -9
        run: |
          # Each export's artifact, and the server script that writes its records.
          case "$OPERATION" in
            export) artifact=sentence-export exporter=export-sentence-backfill.js ;;
            corpus-export) artifact=corpus-export exporter=export-corpus-audit.js ;;
            *) echo "::error::$OPERATION is not an export" >&2; exit 1 ;;
          esac
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          REMOTE_SCRIPT="EXPORTER=$exporter"$'\n'"$EXPORT_SCRIPT" \
            bash scripts/offline/bridge-export.sh "$artifact" "$RUNNER_TEMP/$artifact.dpb"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.export.outputs.artifact }}
          path: ${{ runner.temp }}/${{ steps.export.outputs.artifact }}.dpb
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Each import decrypts its release asset on the runner, for its own operation and release tag only,
  # and streams the bundle to the VPS over the pinned SSH channel (scripts/offline/bridge-import.sh).
  # The bundle arrives on the remote script's standard input, so only the unpacking may read it. The
  # remote script's EXIT trap removes the unpacked bundle from the container however the script ends:
  # after an import that succeeds or fails, or an unpacking cut short.
  import:
    # The publishers find their import's job by its name, the operation.
    name: ${{ inputs.operation }}
    if: inputs.operation == 'import' || endsWith(inputs.operation, '-import')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.operation == 'corpus-import' && 90 || inputs.operation == 'essay-import' && 30 || 75 }}
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    steps:
      - name: Validate import input
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]{1,200}$ ]]

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/offline/bridge-crypto.mjs
            scripts/offline/bridge-import.sh
            scripts/offline/vps-ssh.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Import the encrypted ${{ inputs.operation }} bundle
        timeout-minutes: ${{ inputs.operation == 'essay-import' && 15 || 60 }}
        env:
          OPERATION: ${{ inputs.operation }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SENTENCE_BRIDGE_KEY: ${{ secrets.SENTENCE_BRIDGE_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          # Runs on the VPS, in root's login shell, zsh, after the line that sets the operation's values below.
          IMPORT_SCRIPT: |
            set -eo pipefail
            exec 3<&0 < /dev/null
            cd /opt/dictprop-vps
            if [ -n "$MIN_FREE_KB" ]; then
              AVAILABLE_KB=$(df -Pk /opt/dictprop-vps | awk 'NR == 2 { print $4 }')
              echo "$CAPACITY capacity: ${AVAILABLE_KB}KB free; floor ${MIN_FREE_KB}KB"
              test "$AVAILABLE_KB" -ge "$MIN_FREE_KB"
            fi
            trap "docker compose exec -T app rm -rf $BUNDLE" EXIT
            docker compose exec -T app sh -c "rm -rf $BUNDLE && mkdir -p $BUNDLE && tar -xz -C $BUNDLE" <&3
            exec 3<&-
            if [ -n "$NICENESS" ]; then
              docker compose exec -T app nice -n "$NICENESS" node "server/dist/scripts/$IMPORTER" "$BUNDLE/$INPUT"
            else
              docker compose exec -T app node "server/dist/scripts/$IMPORTER" "$BUNDLE/$INPUT"
            fi
        run: |
          # Each operation's release asset, then the values its remote script runs with: where the bundle unpacks
          # in the container, the importer and the file it reads, the niceness it runs at, if lowered, and the free
          # disk the import needs, if it has a floor, with the name the capacity check reports it under.
          case "$OPERATION" in
            import)
              asset=sentence-backfill.enc
              values='BUNDLE=/tmp/sentence-backfill IMPORTER=import-sentence-backfill.js INPUT=manifest.json NICENESS=10' ;;
            enrichment-import)
              asset=sentence-enrichments.enc
              values='BUNDLE=/tmp/sentence-enrichments IMPORTER=import-sentence-enrichments.js INPUT=manifest.json NICENESS=10'
              values="$values MIN_FREE_KB=$((5 * 1024 * 1024)) CAPACITY=example-enrichment" ;;
            essay-import)
              asset=private-essay-catalog.enc
              values='BUNDLE=/tmp/private-essay-catalog IMPORTER=import-private-essay-catalog.js INPUT=catalog.json' ;;
            corpus-import)
              asset=corpus-audit.enc
              values='BUNDLE=/tmp/corpus-audit IMPORTER=import-corpus-audit.js INPUT=manifest.json' ;;
            image-import)
              asset=offline-images.enc
              values='BUNDLE=/tmp/offline-images IMPORTER=import-offline-images.js INPUT=manifest.json NICENESS=10' ;;
            audio-import)
              asset=offline-audio.enc
              values='BUNDLE=/tmp/offline-audio IMPORTER=import-offline-tts.js INPUT=manifest.json NICENESS=10'
              values="$values MIN_FREE_KB=$((5 * 1024 * 1024)) CAPACITY=offline-audio" ;;
            *) echo "::error::$OPERATION is not an import" >&2; exit 1 ;;
          esac
          # The values line starts empty, so nothing the remote shell inherits can fill a value an operation leaves out.
          REMOTE_SCRIPT="NICENESS= MIN_FREE_KB= CAPACITY= $values"$'\n'"$IMPORT_SCRIPT" \
            bash scripts/offline/bridge-import.sh "$OPERATION" "$asset"
