name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEEPINFRA_API_KEY
          command_timeout: 30m
          script: |
            set -e
            cd /opt/dictprop-vps
            git pull origin main
            # Ensure swap exists for low-memory VPS
            if [ ! -f /swapfile ]; then
              (fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile) || true
            fi
            swapon /swapfile 2>/dev/null || true
            # Diagnostics before rebuild — never fail the deploy on these
            echo "=== CONTAINER LOGS BEFORE REBUILD ==="
            docker compose logs --tail=200 || true
            echo "=== CONTAINER STATUS ==="
            docker compose ps || true
            echo "=== DMESG OOM ==="
            dmesg | grep -i "oom\|killed\|out of memory" | tail -10 || true
            # Sync the DeepInfra key from the GH Actions secret WITHOUT clobbering other .env vars
            # (Google OAuth creds live here too). Guarded so an empty/unset secret never blanks the key.
            if [ -n "$DEEPINFRA_API_KEY" ]; then
              if grep -q '^DEEPINFRA_API_KEY=' .env 2>/dev/null; then
                sed -i "s|^DEEPINFRA_API_KEY=.*|DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY}|" .env
              else
                echo "DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY}" >> .env
              fi
            fi
            echo "=== REBUILDING ==="
            # set -e makes a failed build fail the job (no more silent false-success).
            docker compose up -d --build
            # Prune dangling images only — keep build cache so npm ci stays warm between deploys.
            docker image prune -f || true
            echo "Deploy complete"
            sleep 15
            # Fail the deploy if the new container isn't healthy.
            curl -sf http://localhost:3000/api/health || { echo "Health check failed"; exit 1; }
