name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # SHA-256 of the VPS's ECDSA host key, the key appleboy's Go SSH client negotiates. ssh-action and
  # scp-action refuse a host presenting any other key. Read on the VPS and scanned from a runner on 2026-10-01.
  VPS_SSH_FINGERPRINT: SHA256:cWQ58bKePv6GhjAw38ul5Xp0/CnivzcAF5G68MtSAZ0

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Install zsh, the VPS's login shell, for the remote-script tests
        run: command -v zsh >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends zsh; }
      - name: Verify release
        run: npm run check

  build-image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ghcr.io/younotafish/dictprop-vps:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    # This job's token goes to the server to pull the image, so it can only read packages.
    permissions:
      contents: read
      packages: read
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          RELEASE_IMAGE: ghcr.io/younotafish/dictprop-vps:${{ github.sha }}
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ env.VPS_SSH_FINGERPRINT }}
          envs: DEEPINFRA_API_KEY,GHCR_TOKEN,GHCR_USERNAME,RELEASE_IMAGE
          command_timeout: 60m
          script: |
            set -e
            cd /opt/dictprop-vps
            # A failed prior release may have left the checkout detached at its rollback commit.
            PREVIOUS_SHA="$(git rev-parse HEAD)"
            # Until the new release is healthy, any exit puts the checkout back on the commit the running
            # container came from, and neither the registry login nor a half-written .env outlives the script.
            RELEASE_LIVE=0
            REGISTRY_CONFIG=""
            ENV_TEMP=""
            restore_checkout() {
              if [ "$(git rev-parse HEAD)" != "$PREVIOUS_SHA" ]; then
                git checkout --quiet --detach "$PREVIOUS_SHA" && echo "Checkout restored to $PREVIOUS_SHA"
              fi
            }
            # ssh runs this script in root's login shell, zsh, where $status is a read-only name for $?.
            finish() {
              exit_code=$?
              set +e
              [ -z "$REGISTRY_CONFIG" ] || rm -rf "$REGISTRY_CONFIG"
              [ -z "$ENV_TEMP" ] || rm -f "$ENV_TEMP"
              [ "$RELEASE_LIVE" -eq 1 ] || restore_checkout
              exit "$exit_code"
            }
            trap finish EXIT
            git switch main
            git pull --ff-only origin main
            # Ensure swap exists for low-memory VPS
            if [ ! -f /swapfile ]; then
              (fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile) || true
            fi
            swapon /swapfile 2>/dev/null || true
            # Recover backup space before writing another full database copy. Container images are
            # built remotely now, so deploys must not garbage-collect BuildKit while the app is live.
            echo "=== DISK BEFORE CLEANUP ==="
            df -h . || true
            docker system df || true
            # Imports copy the database to pre-<operation>-<time>.db before they write it, and the disk only
            # has room for one copy beside the one being written, so their copies and these share one slot.
            list_copies() {
              find data/backups -maxdepth 1 -type f \( -name 'dictprop-*.db' -o -name 'pre-*.db' \) \
                -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-
            }
            # Opening a copy leaves -wal and -shm files beside it.
            remove_copy() {
              rm -f "$1" "$1-wal" "$1-shm" "$1.verified"
            }
            # Remove abandoned/old backup copies before deciding whether a fresh snapshot is needed.
            SKIP_DATABASE_BACKUP=0
            if [ -f data/dictprop.db ]; then
              mkdir -p data/backups
              find data/backups -type f -name '*.partial' -delete
              LATEST_BACKUP="$(list_copies | head -n 1)"
              BACKUP_MARKER="${LATEST_BACKUP}.verified"
              if [ -n "$LATEST_BACKUP" ] && [ -f "$BACKUP_MARKER" ] && [ "$BACKUP_MARKER" -nt "$LATEST_BACKUP" ]; then
                echo "Reusing persisted verification for $LATEST_BACKUP"
              elif [ -n "$LATEST_BACKUP" ] && python3 -c '
            import sqlite3, sys
            db = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro&immutable=1", uri=True)
            result = db.execute("PRAGMA quick_check").fetchone()
            db.close()
            raise SystemExit(0 if result == ("ok",) else 1)
            ' "$LATEST_BACKUP"; then
                touch "$BACKUP_MARKER"
              elif [ -n "$LATEST_BACKUP" ]; then
                echo "Removing incomplete backup: $LATEST_BACKUP"
                rm -f "$LATEST_BACKUP" "$BACKUP_MARKER"
                LATEST_BACKUP=""
              fi
              if [ -n "$LATEST_BACKUP" ]; then
                BACKUP_AGE_SECONDS="$(( $(date +%s) - $(stat -c %Y "$LATEST_BACKUP") ))"
                if [ "$BACKUP_AGE_SECONDS" -lt 43200 ]; then
                  echo "Reusing verified backup from ${BACKUP_AGE_SECONDS}s ago"
                  SKIP_DATABASE_BACKUP=1
                fi
              fi
              # Keep only the newest verified snapshot. A new backup temporarily needs a second copy,
              # but the older one remains available if that copy fails and is pruned only after success.
              list_copies | tail -n +2 | while read -r copy; do remove_copy "$copy"; done
              find data/backups -type f -name '*.db.verified' | while read -r marker; do
                [ -f "${marker%.verified}" ] || rm -f "$marker"
              done
            fi
            # Take a transactionally consistent online SQLite backup before the new container can run
            # schema migrations. Retention above leaves room for the atomic copy, and a copy that would
            # fill the disk under the live database is refused instead.
            if [ -f data/dictprop.db ] && [ "$SKIP_DATABASE_BACKUP" -eq 0 ]; then
              echo "=== DISK BEFORE BACKUP ==="
              df -h . || true
              DATABASE_BYTES=$(( $(stat -c %s data/dictprop.db) + $(stat -c %s data/dictprop.db-wal 2>/dev/null || echo 0) ))
              NEEDED_KB=$(( DATABASE_BYTES / 1024 + 512 * 1024 ))
              AVAILABLE_KB="$(df -Pk data/backups | awk 'NR == 2 { print $4 }')"
              if [ "$AVAILABLE_KB" -lt "$NEEDED_KB" ]; then
                echo "::error::Not deploying: a database backup needs ${NEEDED_KB}KB free and ${AVAILABLE_KB}KB are"
                exit 1
              fi
              BACKUP_NAME="dictprop-$(date -u +%Y%m%dT%H%M%SZ)-${{ github.sha }}.db"
              BACKUP_TEMP="$BACKUP_NAME.partial"
              if [ -n "$(docker compose ps -q app 2>/dev/null)" ]; then
                docker compose exec -T -e BACKUP_PATH="/app/data/backups/$BACKUP_TEMP" app node -e '
                  const Database = require("/app/server/node_modules/better-sqlite3");
                  const db = new Database("/app/data/dictprop.db", { readonly: true });
                  db.backup(process.env.BACKUP_PATH)
                    .then(() => db.close())
                    .catch((error) => { console.error(error); process.exit(1); });
                '
              else
                python3 -c 'import sqlite3, sys; source = sqlite3.connect(sys.argv[1]); target = sqlite3.connect(sys.argv[2]); source.backup(target); target.close(); source.close()' \
                  data/dictprop.db "data/backups/$BACKUP_TEMP"
              fi
              mv "data/backups/$BACKUP_TEMP" "data/backups/$BACKUP_NAME"
              touch "data/backups/$BACKUP_NAME.verified"
              # The new verified copy supersedes the older snapshot.
              list_copies | tail -n +2 | while read -r copy; do remove_copy "$copy"; done
            fi
            # Sync the DeepInfra key from the GH Actions secret WITHOUT clobbering other .env vars
            # (Google OAuth creds live here too). Guarded so an empty/unset secret never blanks the key.
            # The key is written as data, never spliced into a sed program, and one with a newline or other
            # control character is refused. The new file takes .env's mode and owner and replaces it in one rename.
            if [ -n "$DEEPINFRA_API_KEY" ]; then
              case "$DEEPINFRA_API_KEY" in
                *[[:cntrl:]]*)
                  echo "::error::DEEPINFRA_API_KEY contains a control character; .env left unchanged"
                  exit 1
                  ;;
              esac
              ENV_TEMP="$(umask 077 && mktemp .env.XXXXXX)"
              if [ -f .env ]; then
                cp -p .env "$ENV_TEMP"
                grep -v '^DEEPINFRA_API_KEY=' .env > "$ENV_TEMP" || [ $? -eq 1 ]
              fi
              printf 'DEEPINFRA_API_KEY=%s\n' "$DEEPINFRA_API_KEY" >> "$ENV_TEMP"
              mv -f "$ENV_TEMP" .env
              ENV_TEMP=""
            fi
            echo "=== PULLING PREBUILT RELEASE ==="
            # Log in through a throwaway client config, so the registry token never lands in root's Docker config,
            # and drop any login an earlier deploy left there. Compose then needs only local images.
            docker logout ghcr.io >/dev/null 2>&1 || true
            REGISTRY_CONFIG="$(mktemp -d)"
            chmod 700 "$REGISTRY_CONFIG"
            printf '%s\n' "$GHCR_TOKEN" | DOCKER_CONFIG="$REGISTRY_CONFIG" docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            DOCKER_CONFIG="$REGISTRY_CONFIG" docker pull "$RELEASE_IMAGE"
            rm -rf "$REGISTRY_CONFIG"
            REGISTRY_CONFIG=""
            CURRENT_CONTAINER="$(docker compose ps -q app 2>/dev/null || true)"
            PREVIOUS_IMAGE_ID=""
            ROLLBACK_IMAGE="dictprop-vps:rollback-${{ github.run_id }}"
            if [ -n "$CURRENT_CONTAINER" ]; then
              PREVIOUS_IMAGE_ID="$(docker inspect --format '{{.Image}}' "$CURRENT_CONTAINER")"
              docker image tag "$PREVIOUS_IMAGE_ID" "$ROLLBACK_IMAGE"
            fi
            wait_for_health() {
              consecutive=0
              # Cold SQLite page-cache work may briefly occupy the single Node thread after a large
              # backfill. Do not roll back a healthy release merely because its first sync is slow.
              for attempt in $(seq 1 120); do
                if curl --max-time 3 -sf http://localhost:3000/api/health >/dev/null; then
                  consecutive=$((consecutive + 1))
                  if [ "$consecutive" -ge 3 ]; then return 0; fi
                else
                  consecutive=0
                fi
                sleep 2
              done
              return 1
            }
            # Prints the app container's state and a short excerpt of its log. Failed requests can log words and
            # sentences, and this run log is public, so the excerpt keeps only startup and error lines with quoted
            # text masked. The whole tail goes to a root-only file on the server.
            report_container() {
              container="$(docker compose ps -a -q app 2>/dev/null | head -n 1)"
              if [ -z "$container" ]; then
                echo "No app container exists"
                return 0
              fi
              docker inspect --format 'App container: {{.State.Status}}, exit code {{.State.ExitCode}}, {{.RestartCount}} restarts, OOM-killed {{.State.OOMKilled}}{{if .State.Health}}, health {{.State.Health.Status}}{{end}}' "$container"
              mkdir -p data/deploy-logs
              chmod 700 data/deploy-logs
              log_file="data/deploy-logs/${{ github.run_id }}-${{ github.run_attempt }}-$1.log"
              (umask 077 && docker logs --timestamps --tail 2000 "$container" > "$log_file" 2>&1)
              echo "Its last 2000 log lines are in /opt/dictprop-vps/$log_file on the server"
              echo "Startup and error lines, quoted text masked:"
              grep -aiE 'starting on port|server running|closing http server|\[migrate\]|migration|uncaught|unhandled|fatal|error|exception|cannot find module|sqlite|eaddrinuse|enospc|enomem|eacces|killed|[[:space:]]at .*(/app/|node:)' "$log_file" \
                | grep -aivE 'deepseek|analysis|analyze request|\[tts\]|google (token|id_token)|"requestId"|[[:space:]]failed "' \
                | tail -n 40 \
                | sed -E "s/\"[^\"]*\"/\"...\"/g; s/'[^']{12,}'/'...'/g" \
                | cut -c1-240
              # Keep the ten newest logs.
              ls -1t data/deploy-logs/*.log | tail -n +11 | xargs -r rm -f
            }
            echo "=== STARTING RELEASE ==="
            RELEASE_FAILED=""
            if ! DICTPROP_IMAGE="$RELEASE_IMAGE" docker compose up -d --no-build; then
              RELEASE_FAILED="could not be started"
            elif ! wait_for_health; then
              RELEASE_FAILED="failed health checks"
            fi
            if [ -n "$RELEASE_FAILED" ]; then
              echo "::error::The new release $RELEASE_FAILED; restoring the previous release from $PREVIOUS_SHA"
              report_container release || true
              # The previous image starts with the compose file it was deployed with.
              restore_checkout || true
              if [ -z "$PREVIOUS_IMAGE_ID" ]; then
                echo "::error::No container was running before this deploy, so there is nothing to roll back to"
              elif DICTPROP_IMAGE="$ROLLBACK_IMAGE" docker compose up -d --no-build && wait_for_health; then
                echo "Rollback to $PREVIOUS_SHA is healthy"
              else
                echo "::error::The rollback failed too"
                report_container rollback || true
              fi
              exit 1
            fi
            RELEASE_LIVE=1
            echo "Release is healthy"
            # Every release pulls a new image, so drop the earlier releases and the rollback tags failed
            # deploys left, keeping only the image now running.
            docker image ls --format '{{.Repository}}:{{.Tag}}' \
              | grep -E '^(ghcr\.io/younotafish/dictprop-vps:|dictprop-vps:rollback-)' \
              | grep -vxF "$RELEASE_IMAGE" \
              | xargs -r docker image rm >/dev/null || true
            echo "=== DISK AFTER DEPLOY ==="
            df -h . || true
            docker system df || true
            echo "Deploy complete"
