name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Verify release
        run: npm run check

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEEPINFRA_API_KEY
          command_timeout: 60m
          script: |
            set -e
            cd /opt/dictprop-vps
            # A failed prior release may have left the checkout detached at its rollback commit.
            PREVIOUS_SHA="$(git rev-parse HEAD)"
            git switch main
            git pull --ff-only origin main
            # Ensure swap exists for low-memory VPS
            if [ ! -f /swapfile ]; then
              (fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile) || true
            fi
            swapon /swapfile 2>/dev/null || true
            # Recover disk before writing another full database copy. The VPS has a small root disk;
            # retaining every recent BuildKit layer can leave SQLite with no room for its backup.
            echo "=== DISK BEFORE CLEANUP ==="
            df -h . || true
            du -sh data data/backups 2>/dev/null || true
            docker image prune -f || true
            # Remove abandoned/old backup copies before deciding whether the Docker cache must go.
            SKIP_DATABASE_BACKUP=0
            if [ -f data/dictprop.db ]; then
              mkdir -p data/backups
              find data/backups -type f -name '*.partial' -delete
              LATEST_BACKUP="$(find data/backups -type f -name 'dictprop-*.db' -printf '%T@ %p\n' \
                | sort -nr | head -n 1 | cut -d' ' -f2-)"
              BACKUP_MARKER="${LATEST_BACKUP}.verified"
              if [ -n "$LATEST_BACKUP" ] && [ -f "$BACKUP_MARKER" ] && [ "$BACKUP_MARKER" -nt "$LATEST_BACKUP" ]; then
                echo "Reusing persisted verification for $LATEST_BACKUP"
              elif [ -n "$LATEST_BACKUP" ] && python3 -c '
            import sqlite3, sys
            db = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro&immutable=1", uri=True)
            result = db.execute("PRAGMA quick_check").fetchone()
            db.close()
            raise SystemExit(0 if result == ("ok",) else 1)
            ' "$LATEST_BACKUP"; then
                touch "$BACKUP_MARKER"
              elif [ -n "$LATEST_BACKUP" ]; then
                echo "Removing incomplete backup: $LATEST_BACKUP"
                rm -f "$LATEST_BACKUP" "$BACKUP_MARKER"
                LATEST_BACKUP=""
              fi
              if [ -n "$LATEST_BACKUP" ]; then
                BACKUP_AGE_SECONDS="$(( $(date +%s) - $(stat -c %Y "$LATEST_BACKUP") ))"
                if [ "$BACKUP_AGE_SECONDS" -lt 43200 ]; then
                  echo "Reusing verified backup from ${BACKUP_AGE_SECONDS}s ago"
                  SKIP_DATABASE_BACKUP=1
                fi
              fi
              # Keep only the newest verified snapshot. A new backup temporarily needs a second copy,
              # but the older one remains available if that copy fails and is pruned only after success.
              find data/backups -type f -name 'dictprop-*.db' -printf '%T@ %p\n' \
                | sort -nr | tail -n +2 | cut -d' ' -f2- | xargs -r rm -f
              find data/backups -type f -name 'dictprop-*.db.verified' | while read -r marker; do
                [ -f "${marker%.verified}" ] || rm -f "$marker"
              done
            fi
            # Preserve the fresh npm/build layers when there is room for another database snapshot.
            # If space is tight, a full BuildKit prune is preferable to another SQLITE_FULL failure.
            AVAILABLE_KB="$(df -Pk . | awk 'NR == 2 { print $4 }')"
            DATABASE_KB="$(du -k data/dictprop.db 2>/dev/null | awk '{ print $1 }')"
            BACKUP_HEADROOM_KB="${DATABASE_KB:-0}"
            if [ "$SKIP_DATABASE_BACKUP" -eq 1 ]; then BACKUP_HEADROOM_KB=0; fi
            REQUIRED_KB="$(( BACKUP_HEADROOM_KB + 2 * 1024 * 1024 ))"
            if [ "${AVAILABLE_KB:-0}" -lt "$REQUIRED_KB" ]; then
              echo "Low disk headroom; pruning the full Docker build cache"
              docker builder prune -af || true
            else
              docker builder prune -f --filter 'until=168h' || true
            fi
            # Take a transactionally consistent online SQLite backup before the new container can run
            # schema migrations. Retention and cache cleanup above leave room for the atomic copy.
            if [ -f data/dictprop.db ] && [ "$SKIP_DATABASE_BACKUP" -eq 0 ]; then
              echo "=== DISK BEFORE BACKUP ==="
              df -h . || true
              BACKUP_NAME="dictprop-$(date -u +%Y%m%dT%H%M%SZ)-${{ github.sha }}.db"
              BACKUP_TEMP="$BACKUP_NAME.partial"
              if [ -n "$(docker compose ps -q app 2>/dev/null)" ]; then
                docker compose exec -T -e BACKUP_PATH="/app/data/backups/$BACKUP_TEMP" app node -e '
                  const Database = require("/app/server/node_modules/better-sqlite3");
                  const db = new Database("/app/data/dictprop.db", { readonly: true });
                  db.backup(process.env.BACKUP_PATH)
                    .then(() => db.close())
                    .catch((error) => { console.error(error); process.exit(1); });
                '
              else
                python3 -c 'import sqlite3, sys; source = sqlite3.connect(sys.argv[1]); target = sqlite3.connect(sys.argv[2]); source.backup(target); target.close(); source.close()' \
                  data/dictprop.db "data/backups/$BACKUP_TEMP"
              fi
              mv "data/backups/$BACKUP_TEMP" "data/backups/$BACKUP_NAME"
              # The new verified copy supersedes the older snapshot.
              find data/backups -type f -name 'dictprop-*.db' -printf '%T@ %p\n' \
                | sort -nr | tail -n +2 | cut -d' ' -f2- | xargs -r rm -f
            fi
            # Diagnostics before rebuild — never fail the deploy on these
            echo "=== CONTAINER LOGS BEFORE REBUILD ==="
            docker compose logs --tail=200 || true
            echo "=== CONTAINER STATUS ==="
            docker compose ps || true
            echo "=== DMESG OOM ==="
            dmesg | grep -i "oom\|killed\|out of memory" | tail -10 || true
            # Sync the DeepInfra key from the GH Actions secret WITHOUT clobbering other .env vars
            # (Google OAuth creds live here too). Guarded so an empty/unset secret never blanks the key.
            if [ -n "$DEEPINFRA_API_KEY" ]; then
              if grep -q '^DEEPINFRA_API_KEY=' .env 2>/dev/null; then
                sed -i "s|^DEEPINFRA_API_KEY=.*|DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY}|" .env
              else
                echo "DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY}" >> .env
              fi
            fi
            echo "=== REBUILDING ==="
            # set -e makes a failed build fail the job (no more silent false-success).
            docker compose up -d --build
            # Prune dangling images only — keep build cache so npm ci stays warm between deploys.
            docker image prune -f || true
            echo "Deploy complete"
            wait_for_health() {
              for attempt in $(seq 1 12); do
                if curl -sf http://localhost:3000/api/health >/dev/null; then
                  return 0
                fi
                sleep 5
              done
              return 1
            }
            if ! wait_for_health; then
              echo "New release failed health checks; rebuilding previous commit $PREVIOUS_SHA"
              docker compose logs --tail=200 || true
              git checkout --detach "$PREVIOUS_SHA"
              docker compose up -d --build
              if wait_for_health; then
                echo "Rollback to $PREVIOUS_SHA is healthy"
              else
                echo "Rollback also failed health checks"
              fi
              exit 1
            fi
