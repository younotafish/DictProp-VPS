name: Deploy Lake Loop to VPS

on:
  workflow_dispatch:
    inputs:
      archive_b64:
        description: Encrypted Lake Loop site archive; leave empty to reapply only the Caddy route
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  # SHA-256 of the VPS's ECDSA host key, the key appleboy's Go SSH client negotiates. ssh-action and
  # scp-action refuse a host presenting any other key. Read on the VPS and scanned from a runner on 2026-10-01.
  VPS_SSH_FINGERPRINT: SHA256:cWQ58bKePv6GhjAw38ul5Xp0/CnivzcAF5G68MtSAZ0

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: dictprop-production
      cancel-in-progress: false
    steps:
      - name: Decrypt and validate site archive
        if: inputs.archive_b64 != ''
        env:
          ARCHIVE_B64: ${{ inputs.archive_b64 }}
          ARCHIVE_KEY: ${{ secrets.TRIP_ARCHIVE_KEY }}
        run: |
          set -euo pipefail
          test -n "$ARCHIVE_B64"
          test -n "$ARCHIVE_KEY"
          mkdir -p lake-loop-upload
          printf '%s' "$ARCHIVE_B64" \
            | base64 --decode \
            | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:ARCHIVE_KEY \
            | tar -xjf - -C lake-loop-upload
          test -s lake-loop-upload/index.html
          test -s lake-loop-upload/styles.css
          test -s lake-loop-upload/app.js
          test "$(find lake-loop-upload -maxdepth 1 -type f | wc -l)" -eq 3

      - name: Upload private static site
        if: inputs.archive_b64 != ''
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ env.VPS_SSH_FINGERPRINT }}
          source: lake-loop-upload/*
          target: /var/www/lake-loop-26
          strip_components: 1
          rm: true
          overwrite: true

      - name: Configure Google-protected Caddy route
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ env.VPS_SSH_FINGERPRINT }}
          command_timeout: 3m
          script: |
            set -eu
            test -s /var/www/lake-loop-26/index.html
            chown -R root:root /var/www/lake-loop-26
            find /var/www/lake-loop-26 -type d -exec chmod 755 {} +
            find /var/www/lake-loop-26 -type f -exec chmod 644 {} +

            # The site loads only its own files, plus data: images from its stylesheet, and has no inline script
            # or style, forms, frames or plugins.
            csp="default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

            backup="/etc/caddy/Caddyfile.lake-loop.$(date -u +%Y%m%dT%H%M%SZ)"
            cp /etc/caddy/Caddyfile "$backup"

            CSP="$csp" python3 - <<'PY'
            import os
            from pathlib import Path
            from string import Template

            path = Path("/etc/caddy/Caddyfile")
            text = path.read_text(encoding="utf-8")
            begin = "# BEGIN MANAGED LAKE LOOP"
            end = "# END MANAGED LAKE LOOP"

            if begin in text:
                prefix, remainder = text.split(begin, 1)
                _, suffix = remainder.split(end, 1)
                text = prefix.rstrip() + "\n" + suffix.lstrip("\n")

            site = "dictprop.online, www.dictprop.online {"
            if site not in text:
                raise SystemExit("Expected dictprop.online Caddy site block not found")

            block = Template(r"""    # BEGIN MANAGED LAKE LOOP
                @lake_loop_root path /lake-loop-26
                redir @lake_loop_root /lake-loop-26/ 308

                handle_path /lake-loop-26/* {
                    forward_auth localhost:3000 {
                        uri /api/auth/gate?returnTo=/lake-loop-26/
                    }
                    root * /var/www/lake-loop-26
                    header {
                        Content-Security-Policy "$csp"
                        X-Content-Type-Options "nosniff"
                        Referrer-Policy "no-referrer"
                        Cache-Control "private, no-store"
                        X-Robots-Tag "noindex, nofollow, noarchive"
                    }
                    file_server
                }
                # END MANAGED LAKE LOOP""").substitute(csp=os.environ["CSP"])

            insert_at = text.index(site) + len(site)
            text = text[:insert_at] + "\n" + block + text[insert_at:]
            path.write_text(text, encoding="utf-8")
            PY

            if ! caddy fmt --overwrite /etc/caddy/Caddyfile \
              || ! caddy validate --config /etc/caddy/Caddyfile; then
              cp "$backup" /etc/caddy/Caddyfile
              echo "Caddy validation failed; original configuration restored"
              exit 1
            fi

            systemctl reload caddy
            headers="$(mktemp)"
            http_status="$(curl --max-time 10 -sS -D "$headers" -o /dev/null -w '%{http_code}' https://dictprop.online/lake-loop-26/)"
            test "$http_status" = 302
            grep -Eiq '^location: /api/auth/login\?returnTo=%2F(lake-loop-26%2F)?' "$headers"
            # The app's redirect brings its own policy too, so look for this route's exact one.
            tr -d '\r' < "$headers" | grep -Fqix "content-security-policy: $csp"
            echo "Lake Loop deployed and protected by Google login (HTTP $http_status without a session)"
