name: Inspect Caddy for Lake Loop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Caddy configuration
        uses: appleboy/ssh-action@v1
        with:
          host: 107.152.47.101
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            echo '=== CADDY VERSION ==='
            caddy version
            echo '=== CADDYFILE ==='
            sed -n '1,240p' /etc/caddy/Caddyfile
            echo '=== STATIC ROOTS ==='
            find /var/www -maxdepth 2 -type d -print 2>/dev/null | sort || true
