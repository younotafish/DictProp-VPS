services:
  app:
    image: ${DICTPROP_IMAGE:-dictprop-vps:local}
    build: .
    ports:
      # Loopback only: Caddy on the host is the public entry point. Docker's port publishing bypasses UFW, so
      # an all-interfaces binding would serve the app in plain HTTP on the server's public IP.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
    stop_grace_period: 3s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
