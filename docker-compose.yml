services:
  app:
    # deploy.yml names the release image in DICTPROP_IMAGE, and compose never builds one: without the variable, `up`
    # wants dictprop-vps:local, which only a hand-run `docker build -t dictprop-vps:local .` makes, and fails without it.
    image: ${DICTPROP_IMAGE:-dictprop-vps:local}
    ports:
      # Loopback only: Caddy on the host is the public entry point. Docker's port publishing bypasses UFW, so
      # an all-interfaces binding would serve the app in plain HTTP on the server's public IP.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
    # Docker sends SIGKILL this long after SIGTERM, so the server's forced exit, SHUTDOWN_DEADLINE_MS in
    # server/src/shutdown.ts, must come sooner to ever run (server/test/shutdown.test.ts checks it).
    # A longer grace would lengthen every deploy's container swap while an AI request is in flight.
    stop_grace_period: 3s
    restart: unless-stopped
    # Nothing in the container may gain privileges through a setuid binary.
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
